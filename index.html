<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132A2E">
<title>Conociéndonos — Una guía para comprender y acompañar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conociéndonos">
<style>
:root{
  --ink:#132A2E; --ink-2:#26454A; --muted:#596C6F;
  --paper:#F2F0EB; --surface:#FFFFFF; --line:#DDD9D0;
  --jade:#2E6E5B; --jade-soft:#E4EFEA;
  --baja:#3B6584; --media:#7E5B19; --alta:#9C4A48;
  --baja-bg:#E8F0F6; --media-bg:#F8EFDC; --alta-bg:#F6E9E8;
  --r:14px;
  --display:"Fraunces",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(560px 420px at 4% 0%, #FBE6DB99, transparent 60%),
    radial-gradient(520px 400px at 96% 6%, #DFEAF499, transparent 60%),
    radial-gradient(560px 460px at 100% 45%, #EDEAF699, transparent 60%),
    radial-gradient(560px 460px at 0% 55%, #FCEDEF99, transparent 60%),
    radial-gradient(560px 460px at 92% 96%, #DDF0EF99, transparent 60%),
    radial-gradient(560px 460px at 6% 98%, #FCF5DF99, transparent 60%),
    var(--paper);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
/* Accesibilidad y lectura sencilla */
body.a11y-large{font-size:19px}
body.a11y-large h1{font-size:clamp(30px,8vw,42px)}
body.a11y-large h2{font-size:26px}
body.a11y-large .hint, body.a11y-large .foot{font-size:14px}
body.a11y-contrast{--ink:#000;--ink-2:#111;--muted:#333;--paper:#fff;--surface:#fff;--line:#555;--jade:#075c42;--jade-soft:#e5f5ed}
body.a11y-contrast .card, body.a11y-contrast .readout, body.a11y-contrast details{border-color:#555}
/* Lectura sencilla: oculta texto de apoyo (explicaciones, subtítulos, matices) y deja solo lo imprescindible para registrar */
body.a11y-simple .simple-hide{display:none !important}
body.a11y-simple .quick-event small{display:none}
body.a11y-simple .quick-event{padding:16px 12px}
.a11y-note{font-size:13px;color:var(--muted);line-height:1.5}
.connection-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;color:var(--muted)}
.connection-status .dot{width:8px;height:8px;border-radius:50%;background:#2E6E5B;display:inline-block}
.connection-status.offline .dot{background:#9C4A48}
.context-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.context-chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;font:inherit;color:var(--ink);min-height:46px}
.context-chip.on{border-color:var(--jade);background:var(--jade-soft);font-weight:600}
@media(max-width:520px){.context-grid{grid-template-columns:1fr}}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #1d6fa5;outline-offset:2px}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:-.01em;
  font-variation-settings:"SOFT" 40,"WONK" 1;}
button{font-family:inherit; font-size:inherit; cursor:pointer}
a{color:var(--jade)}

/* chrome */
header.app{
  background:var(--ink); color:#EAF0EE; padding:calc(16px + env(safe-area-inset-top)) 20px 16px;
  position:relative;
}
header.app.con-captura{
  padding-top:calc(52px + env(safe-area-inset-top));
}
header.app .eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:#7FA79C; margin-bottom:6px;
}
header.app h1{font-size:22px; color:#FFF; line-height:1.15}
header.app .sub{font-size:13px; color:#A9C2BB; margin-top:6px}

main{padding:18px 16px 24px; max-width:640px; margin:0 auto}
.view{display:none} .view.on{display:block}

/* nav */
nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:rgba(255,255,255,.96); backdrop-filter:blur(8px);
  border-top:1px solid var(--line); display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1; background:none; border:0; padding:11px 4px 13px; color:var(--muted);
  font-size:11.5px; letter-spacing:.02em; display:flex; flex-direction:column; align-items:center; gap:5px;
}
nav.tabs button .ic{font-family:var(--mono); font-size:15px; font-weight:500}
nav.tabs button.on{color:var(--jade); font-weight:600}

/* cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:12px}
.rasgo-card{display:flex; align-items:center; gap:14px; width:100%; text-align:left; border:1px solid var(--line);
  border-left-width:5px; border-left-color:var(--rc, var(--line));
  background:var(--surface); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.rasgo-card:active{background:#FAFAF8}
.ava{width:44px; height:44px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  background:var(--rt, var(--jade-soft))}
.ava img{width:29px; height:29px; object-fit:contain}
.ava.lg{width:72px; height:72px}
.ava.lg img{width:48px; height:48px}
.rasgo-card .body{flex:1; min-width:0}
.rasgo-card .t{font-weight:600; font-size:15px}
.rasgo-card .m{font-size:12.5px; color:var(--muted); margin-top:2px}
.rasgo-card .score{font-family:var(--mono); font-size:20px; font-weight:500; flex:none}
.rasgo-card .score.empty{color:#C3C9C6; font-size:15px}

.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
.section-title{font-family:var(--display); font-size:19px; margin:22px 0 10px}
.section-title:first-child{margin-top:0}
.hint{font-size:13px; color:var(--muted); line-height:1.45}

/* pills */
.band{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:3px 9px; border-radius:99px; font-weight:500}
.band.b{background:var(--baja-bg); color:var(--baja)}
.band.m{background:var(--media-bg); color:var(--media)}
.band.a{background:var(--alta-bg); color:var(--alta)}

label.f{display:block; font-size:13.5px; font-weight:500; margin:16px 0 7px; line-height:1.35}
input[type=text],input[type=number],input[type=time],input[type=date],textarea,select{
  width:100%; font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
  background:#FCFCFA; color:var(--ink)
}
textarea{min-height:64px; resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--jade); outline-offset:1px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
.chip{border:1px solid var(--line); background:#FCFCFA; border-radius:99px; padding:10px 14px; min-height:40px;
  font-size:13.5px; color:var(--ink-2); display:inline-flex; align-items:center}
.chip.on{background:var(--jade); border-color:var(--jade); color:#fff}
.seg{display:flex; gap:8px; flex-wrap:wrap}
.seg button{flex:1 1 auto; min-width:44%; min-height:44px; border:1px solid var(--line); background:#FCFCFA; border-radius:10px;
  padding:11px 10px; font-size:13.5px; color:var(--ink-2); line-height:1.25}
.seg button.on{background:var(--ink); border-color:var(--ink); color:#fff}

.btn{display:block; width:100%; background:var(--jade); color:#fff; border:0; border-radius:12px;
  padding:14px; font-size:15px; font-weight:600; margin-top:18px}
.btn.ghost{background:transparent; color:var(--jade); border:1px solid var(--jade); margin-top:10px}
.btn.quiet{background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:500}
.btn.sm{padding:10px 12px; font-size:13.5px; margin-top:8px; border-radius:10px}
.row2{display:flex; gap:8px}
.row2 .btn{margin-top:0}
.btn[disabled]{opacity:.4}

/* suggested band readout */
.readout{border:1px solid var(--line); border-radius:12px; padding:13px 14px; background:#FCFCFA; margin-top:14px}
.readout .lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.readout .val{margin-top:6px; font-size:14px}

/* SIGNATURE: dial de decisión */
.dial{margin-top:8px; border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:15px 14px 16px}
.dial h3{font-size:15px; font-family:var(--sans); font-weight:600}
.dial p{margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.45}
.track{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:14px}
.track button{border:1px solid var(--line); background:#FCFCFA; border-radius:9px; min-height:48px;
  font-family:var(--mono); font-size:15px; color:var(--ink-2); position:relative}
.track button.in-band{background:var(--jade-soft); border-color:#BFDBCF; color:var(--jade)}
.track button.on{background:var(--ink); border-color:var(--ink); color:#fff; font-weight:500}
.track-legend{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px;
  color:var(--muted); margin-top:7px; letter-spacing:.04em}
.diverge{margin-top:11px; font-size:12.5px; color:var(--ink-2); background:#F5F3EE; border-radius:9px; padding:9px 11px}

/* radar */
.radar-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:8px 4px 4px}
svg{display:block; width:100%; height:auto}
.axis-note{font-size:12px; color:var(--muted); margin:10px 2px 0; line-height:1.45}

table.gap{width:100%; border-collapse:collapse; font-size:13.5px}
table.gap th{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); text-align:left; font-weight:400; padding:0 0 8px}
table.gap td{padding:9px 0; border-top:1px solid var(--line); vertical-align:top}
table.gap td.num{font-family:var(--mono); text-align:center; width:38px}

.slider-row{margin-bottom:14px}
.slider-row .top{display:flex; justify-content:space-between; align-items:baseline; font-size:14px}
.slider-row .top b{font-weight:500}
.slider-row .top span{font-family:var(--mono); font-size:15px}
input[type=range]{width:100%; margin-top:4px; accent-color:var(--jade)}

details{border-top:1px solid var(--line); padding-top:12px; margin-top:14px}
details summary{font-size:13.5px; color:var(--jade); cursor:pointer; font-weight:500}
details .inner{font-size:13px; color:var(--ink-2); line-height:1.55; margin-top:9px; white-space:pre-line}

.empty{text-align:center; color:var(--muted); font-size:14px; padding:26px 10px; line-height:1.5}
.log-item{border-top:1px solid var(--line); padding:11px 0; display:flex; gap:12px; align-items:flex-start}
.log-item .d{font-family:var(--mono); font-size:11px; color:var(--muted); width:56px; flex:none; padding-top:2px}
.log-item .s{flex:1; font-size:13.5px}
.log-item .p{font-family:var(--mono); font-size:15px}
.del{background:none; border:0; color:var(--muted); font-size:12px; padding:2px 4px}

.foot{font-size:11.5px; color:var(--muted); line-height:1.55; margin-top:26px; border-top:1px solid var(--line); padding-top:14px}
.warn{background:#F6E9E8; border:1px solid #E4CBC9; color:#7C3937; border-radius:10px; padding:11px 13px; font-size:12.5px; line-height:1.5}

/* microacciones */
.m-opt{display:block; width:100%; text-align:left; border:1px solid var(--line); background:#FCFCFA;
  border-radius:12px; padding:12px 14px; margin-top:10px; font-size:14.5px; line-height:1.5; color:var(--ink-2)}
.m-opt.on{border-color:var(--jade); background:var(--jade-soft); color:var(--ink)}
.m-pend{border-left:4px solid var(--jade)}
.m-res{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.m-res button{flex:1 1 46%; min-height:44px; border:1px solid var(--line); background:#FCFCFA;
  border-radius:10px; font-size:13px; padding:9px 8px; color:var(--ink-2)}
.m-note{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5}
.m-rep{border-top:1px solid var(--line); padding:10px 0 8px}
.m-rep:first-of-type{border-top:0}
.m-rep .r{font-family:var(--mono); font-size:11px; color:var(--jade); text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px}

/* overlay: aviso legal + onboarding */
#overlay{position:fixed; inset:0; z-index:100; background:rgba(19,42,46,.55); display:flex;
  align-items:flex-end; justify-content:center; padding:0}
#overlay.hidden{display:none}
.sheet{background:var(--surface); width:100%; max-width:520px; border-radius:20px 20px 0 0;
  padding:26px 22px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto}
@media (min-width:560px){#overlay{align-items:center} .sheet{border-radius:20px; max-height:80vh}}
.sheet .eyebrow{margin-bottom:8px}
.sheet h2{font-size:21px; margin-bottom:12px; line-height:1.2}
.sheet p{font-size:14.5px; line-height:1.55; color:var(--ink-2); margin:0 0 12px}
.sheet .icon{width:52px; height:52px; border-radius:14px; background:var(--jade-soft); color:var(--jade);
  display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:22px; margin-bottom:16px; overflow:hidden}
.sheet .icon img{width:100%; height:100%; object-fit:cover}
.steps3{margin:4px 0 14px}
.steps3 .step{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line)}
.steps3 .step:first-child{border-top:0}
.steps3 .num{font-family:var(--mono); color:var(--jade); font-weight:500; flex:none; width:22px}
.dots{display:flex; gap:6px; justify-content:center; margin:4px 0 18px}
.dots span{width:7px; height:7px; border-radius:99px; background:var(--line)}
.dots span.on{background:var(--jade); width:18px; border-radius:99px}
.sheet-actions{display:flex; gap:10px; align-items:center}
.sheet-actions .skip{background:none; border:0; color:var(--muted); font-size:13.5px; padding:14px 6px}
.sheet-actions .btn{margin-top:0; flex:1}
@media print{nav.tabs,.btn,.back{display:none}}
#reporteImprimible{display:none}
@media print{
  body *{visibility:hidden}
  #reporteImprimible, #reporteImprimible *{visibility:visible}
  #reporteImprimible{display:block; position:absolute; top:0; left:0; width:100%; padding:24px; color:#132A2E}
  #reporteImprimible h1{font-size:22px; margin:0 0 4px}
  #reporteImprimible h2{font-size:16px; margin:22px 0 8px; border-bottom:1px solid #DDD9D0; padding-bottom:4px}
  #reporteImprimible .rep-rasgo{margin-bottom:14px; page-break-inside:avoid}
  #reporteImprimible .rep-ep{font-size:12.5px; color:#26454A; margin:2px 0 2px 12px}
  #reporteImprimible table{width:100%; border-collapse:collapse; font-size:12.5px}
  #reporteImprimible th, #reporteImprimible td{border:1px solid #DDD9D0; padding:5px 8px; text-align:left}
  #reporteImprimible .rep-foot{margin-top:18px; font-size:11px; color:#596C6F}
}
@media (prefers-reduced-motion:no-preference){.view.on{animation:fade .18s ease-out}}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.back{background:none;border:0;color:#A9C2BB;font-size:13px;padding:0 0 8px;font-family:var(--sans)}
.shot{
  position:absolute; top:calc(12px + env(safe-area-inset-top)); left:14px; z-index:5;
  display:none; align-items:center; gap:7px;
  background:#FFFFFF; color:var(--ink); border:none; border-radius:99px;
  padding:7px 13px 7px 9px; box-shadow:0 2px 8px rgba(0,0,0,.35);
  font-family:var(--sans); font-size:12.5px; font-weight:600;
}
.shot svg{display:block; flex:none; width:15px; height:15px}
.shot .lbl{white-space:nowrap}
.shot:active{background:#EDEDED}
.shot.working{opacity:.55}

.quick-event{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);text-align:left;cursor:pointer;transition:.15s ease}
.quick-event:hover,.quick-event:focus-visible{border-color:var(--jade);outline:2px solid transparent}
.quick-event.on{border-color:var(--jade);background:var(--jade-soft);box-shadow:0 0 0 1px var(--jade)}
.btn.small{padding:8px 10px;font-size:12px;white-space:nowrap}
@media(max-width:520px){.quick-event{padding:12px 10px}.quick-event small{font-size:11.5px}}

.pattern-list{margin-top:8px}.pattern-item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}.pattern-item:first-of-type{margin-top:5px}.pattern-item strong{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--ink)}

.flow-integrado{margin-top:8px;display:grid;gap:6px}
.flow-chip,.flow-note{font-size:12px;line-height:1.45;padding:8px 10px;border-radius:10px;background:var(--soft,#f3f6f3);color:var(--text,#233)}
.flow-note{background:var(--paper,#fff);border:1px solid var(--line,#e2e5e1)}

</style>

<style id="v23-family-ui">
.family-intro{margin:10px 0 18px}
.pedagogia{margin:10px 0;border:1px solid var(--line,#ddd);border-radius:12px;padding:0;background:var(--card,#fff)}
.pedagogia summary{cursor:pointer;padding:11px 13px;font-weight:600;list-style:none}
.pedagogia summary::-webkit-details-marker{display:none}
.pedagogia-body{padding:0 13px 13px;font-size:14px;line-height:1.5}
.rasgo-card .m{display:block}
.rasgo-card .t{display:block}
@media(max-width:600px){
  .family-intro h2{font-size:18px}
  .pedagogia-body{font-size:13.5px}
}
</style>
</head>
<body>

<header class="app">
  <button class="back" id="back" style="display:none">‹ Volver</button>
  <button class="shot" id="shot" type="button" aria-label="Descargar esta pantalla como imagen" title="Descargar esta pantalla como imagen">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11.5"/><path d="M7 10.5l5 5 5-5"/><path d="M4.5 19.5h15"/></svg>
    <span class="lbl">Descargar</span>
  </button>
  <div class="eyebrow" id="eyebrow">CONOCIÉNDONOS</div>
  <h1 id="title">Observación familiar</h1>
  <div class="sub" id="sub">9 rasgos · observación doméstica</div>
  <div class="connection-status" id="connection-status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="connection-label">Comprobando conexión…</span></div>
</header>

<main>
  <section class="view on" id="v-rasgos"></section>
  <section class="view" id="v-rapido"></section>
  <section class="view" id="v-rasgo"></section>
  <section class="view" id="v-form"></section>
  <section class="view" id="v-espejo"></section>
  <section class="view" id="v-perfil"></section>
  <section class="view" id="v-feedback"></section>
</main>

<nav class="tabs">
  <button data-tab="rasgos" class="on"><span class="ic">9</span>Rasgos</button>
  <button data-tab="espejo"><span class="ic">↔</span>Espejo</button>
  <button data-tab="perfil"><span class="ic">◈</span>Patrones</button>
</nav>

<div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div id="reporteImprimible" aria-hidden="true"></div>

<script>
/* ─────────── datos del instrumento (trasladados del Excel v1.0) ─────────── */
const RASGOS = [
  {
    id: 1,
    nombre: "Intensidad de la respuesta",

    corto: "Intensidad",
    descripcionCorta: "¿Qué tan fuerte fue la reacción?",
    eje: "Intensidad de la respuesta",
    tipo: "num",
    unidad: "escala 1–10",
    umbral: [
      3,
      7
    ],
    info: {
      observamos: "Qué tan intensa fue la reacción del niño o la niña ante una situación. Intensidad y duración son datos diferentes: una reacción puede ser muy intensa y breve, o menos intensa y prolongada.",
      pregunta: "Qué ocurrió antes, si hubo anticipación, cómo estaba el niño o niña y qué apoyo recibió.",
      noConcluyas: "Que una reacción intensa significa que el niño es problemático, malcriado o incapaz de regularse.",
      proposito: "Identificar qué situaciones tienden a generar respuestas más intensas y qué condiciones ayudan a atravesarlas con mayor bienestar."

        try{ legado = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){ legado = null; }
        if(legado){ await idbSet(db, KEY, legado); try{ localStorage.removeItem(KEY); }catch(e){} }
        return legado;
      }
      return JSON.parse(localStorage.getItem(KEY) || "null");
    }catch(e){ return null; }
  },
  async set(v){
    try{
      if(window.storage){ await window.storage.set(KEY, JSON.stringify(v)); return; }
      const db = await abrirDB();
      if(db){ const ok = await idbSet(db, KEY, v); if(ok) return; }
      localStorage.setItem(KEY, JSON.stringify(v));
    }catch(e){ console.warn("No se pudo guardar:", e); }
  }
};

  r=Math.round(((n>>16)&255)*(1-amt)+255*amt), g=Math.round(((n>>8)&255)*(1-amt)+255*amt), b=Math.round((n&255)*(1-amt)+255*amt);

function bandaDe(r, valor){
  if(valor===""||valor==null) return null;
  if(r.tipo==="cat"){ const o=r.opciones.find(o=>o[0]===valor); return o? o[1]-1 : null; }
  const n = Number(valor); if(!isFinite(n)) return null;
  const [a,b] = umbral(r);
  return n<=a ? 0 : (n<=b ? 1 : 2);
}

function rango(id){ const l=eps(id).map(e=>e.puntuacion); return l.length? [Math.min(...l),Math.max(...l)] : null; }
const bandaClase = i => ["b","m","a"][i];

}

function flujoIntegrado(e){
  if(!e) return "";
  const partes = [];
  if(e.contexto && Array.isArray(e.contexto) && e.contexto.length){
    partes.push(`<div class="flow-chip"><b>Contexto:</b> ${esc(e.contexto.join(", "))}</div>`);

    partes.push(`<div class="flow-chip"><b>Apoyo:</b> ${esc(e.apoyos.join(", "))}</div>`);

  }
  return partes.length ? `<div class="flow-integrado">${partes.join("")}</div>` : "";

/* ─────────── principio de no agregación entre los 9 rasgos ───────────
   promedio(id) y rango(id) solo leen episodios del MISMO rasgo (eps() filtra por e.rasgo===id).
   No existe en el código ninguna función que sume o combine puntuaciones entre rasgos distintos:
   cada uno se calcula, se muestra y se interpreta de forma independiente. Esta función se llama
   desde vPerfil() para dejar esa regla verificable en tiempo de ejecución, no solo en el texto. */
function verificarSinAgregacionGlobal(){
  const porRasgo = RASGOS.map(r => promedio(r.id));
  const conDatos = porRasgo.filter(v => v != null);
  return {
    porRasgo,
    ejemploNoSumar: conDatos.length >= 2
      ? "Ejemplo: " + conDatos.slice(0,2).map(v=>v.toFixed(1)).join(" y ") + " son observaciones de dos rasgos distintos; no se suman ni se combinan en ningún cálculo de la aplicación."
      : "",
    principio: "Cada rasgo se calcula y se muestra por separado. Ningún cálculo de la aplicación suma puntuaciones entre rasgos ni produce un número, perfil o diagnóstico global."
  };
}

          `<button data-p="${n}" aria-pressed="${F.punt===n}" aria-label="Puntuación ${n}${n>=lo&&n<=hi?", dentro de la banda sugerida":""}" class="${n>=lo&&n<=hi?"in-band":""} ${F.punt===n?"on":""}">${n}</button>`).join("")}</div>
        <div class="track-legend"><span>1 · baja</span><span>media</span><span>alta · 10</span></div>
        ${fuera? `<div class="diverge">Te apartaste de la banda sugerida. Eso es legítimo y queda registrado: la app guarda tanto el dato como tu decisión.</div>`:""}
        <button class="btn" id="guardar" ${F.punt==null?"disabled":""}>Guardar registro</button>
      </div>`;
    cont.querySelectorAll("[data-p]").forEach(b=> b.onclick = ()=>{ F.punt = +b.dataset.p; pintarDecision(); });
    const g = cont.querySelector("#guardar");
    if(g) g.onclick = ()=>{
      const ep = {id:String(Date.now()), rasgo:r.id, fecha:F.fecha, situacion:F.situacion,
        extra:F.extra, dato:F.dato, q1:F.q1, q2:F.q2, banda:banda, puntuacion:F.punt, intensidad:F.quickIntensity ?? null, duracion:F.quickDuration ?? null,
        divergio:(F.punt<lo||F.punt>hi), contexto:[...F.contexto], contextoOtro:F.contextoOtro, apoyos:[...F.apoyos], apoyosOtro:F.apoyosOtro}; S.episodios.push(ep);
      if(F.rapidaId && Array.isArray(S.observacionesRapidas)){ S.observacionesRapidas=S.observacionesRapidas.filter(x=>x.id!==F.rapidaId); }
      save(); F = {}; ir("rasgo",{id:r.id});
      microFlujo(ep);
    };
  }
}

const FEEDBACK_URL = "https://script.google.com/macros/s/AKfycbxNkzccxTIeDYDYEdFP3wt_D5T1DnCCb6GDm87nbscbI_6P38wsuGLG0Y5qPbRP8d8b/exec";
const FEEDBACK_QUEUE_KEY = "bitacora-feedback-queue";

function feedbackQueueGet(){
  try{ return JSON.parse(localStorage.getItem(FEEDBACK_QUEUE_KEY) || "[]"); }catch(e){ return []; }
}
function feedbackQueueSet(q){ localStorage.setItem(FEEDBACK_QUEUE_KEY, JSON.stringify(q)); }

function feedbackEnviarUno(payload){
  // no-cors: Apps Script no siempre manda cabeceras CORS; no podemos leer la respuesta,
  // pero el POST sí llega y se guarda en la hoja. Por eso aquí no leemos result.success:
  // simplemente asumimos éxito si fetch no lanza error de red.
  return fetch(FEEDBACK_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  });
}

function feedbackReintentarPendientes(){
  const q = feedbackQueueGet();
  if(!q.length) return;
  Promise.allSettled(q.map(item=> feedbackEnviarUno(item))).then(()=>{
    // no hay forma confiable de saber cuáles llegaron con no-cors, así que
    // se limpia la cola completa: si algún envío realmente falló por red,
    // el usuario puede volver a mandar su feedback desde el menú.
    feedbackQueueSet([]);
  });
}

async function cargarHtml2Canvas(){
  if(typeof html2canvas !== "undefined") return true;
  if(!navigator.onLine) return false;
  return await new Promise(resolve=>{
    const sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    sc.onload=()=>resolve(typeof html2canvas!=="undefined");
    sc.onerror=()=>resolve(false);
    document.head.appendChild(sc);
  });
}

/* descarga la pantalla actual (header + vista activa) como imagen PNG en alta calidad,
   igual que una captura de pantalla — excluye la barra de pestañas inferior, el propio
   botón de descarga y cualquier overlay/reporte oculto */
async function capturarVentana(nombreVista){
  const canvasDisponible = await cargarHtml2Canvas();
  if(!canvasDisponible){
    avisar("La captura como imagen necesita un recurso externo y no está disponible sin conexión. La información sigue disponible: puedes usar la opción de imprimir o guardar en PDF desde Perfil.");
    return;
  }
  const shot = $("#shot");
  if(shot) shot.classList.add("working");
  try{
    const canvas = await html2canvas(document.body, {
      useCORS: true,
      scale: 2,
      backgroundColor: "#F2F0EB",
      ignoreElements: (elemento)=> elemento.matches && elemento.matches("nav.tabs, #overlay, #reporteImprimible, .shot"),
    });
    const a = document.createElement("a");
    a.download = `Bitácora ${nombreVista} ${fechaCorta()}.png`;
    a.href = canvas.toDataURL("image/png");
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){
    console.warn("No se pudo generar la imagen:", e);
    avisar("No se pudo generar la imagen. Intenta de nuevo.");
  }finally{
    if(shot) shot.classList.remove("working");
  }
}

/* ─────────── redacción narrativa (para compartir con un profesionista) ─────────── */
function generarNarrativa(){
  const fechaHoy = new Date().toLocaleDateString("es-MX", {year:"numeric", month:"long", day:"numeric"});
  let t = `BITÁCORA REFLEXIVA DEL TEMPERAMENTO — RESUMEN NARRATIVO\n`;
  t += `Generado el ${fechaHoy}\n\n`;
  t += `Niño o niña: ${S.nino.nombre||"(sin nombre)"}\nEdad: ${S.nino.edad||"no especificada"}\n\n`;
  t += `Este resumen proviene de observación doméstica registrada por la familia con una herramienta basada en el modelo de Thomas & Chess (1956). No es un instrumento de diagnóstico ni sustituye una evaluación profesional; se comparte como insumo para orientar, con mayor precisión, el trabajo de seguimiento.\n\n`;
  t += `── RASGOS OBSERVADOS ──\n\n`;
  RASGOS.forEach(r=>{
    const lista = eps(r.id);
    if(!lista.length) return;
    const p = promedio(r.id), rg = rango(r.id);
    t += `${r.nombre}: promedio ${p.toFixed(1)} de 10${rg?`, con un rango de ${rg[0]} a ${rg[1]} según el contexto`:""}, en ${lista.length} episodio${lista.length>1?"s":""} registrado${lista.length>1?"s":""}.\n`;
    lista.slice().sort((a,b)=>a.fecha<b.fecha?1:-1).forEach(e=>{
      const contextoTxt = ((e.contexto&&e.contexto.length)?e.contexto.join("; "):"") + (e.contextoOtro?`${e.contexto&&e.contexto.length?"; ":""}${e.contextoOtro}`:"");
      t += `  · ${e.fecha} — ${e.situacion||"(sin descripción)"} (puntuación ${e.puntuacion}${e.divergio?", fuera de la banda que sugería el dato observado":""})${e.extra?`: ${e.extra}`:""}${contextoTxt?`\n    Contexto: ${contextoTxt}`:""}\n`;
    });
    t += `\n`;
  });
  t += `── BITÁCORA ESPEJO (cómo se percibe el adulto a sí mismo en los mismos rasgos) ──\n\n`;
  RASGOS.forEach(r=>{
    const a = S.adulto[r.id], p = promedio(r.id);
    if(a==null) return;
    t += `${r.corto}: adulto se ubica en ${a} de 10`;
    if(p!=null){
      const d = Math.abs(a-p);
      const z = d<=3 ? "temperamentos parecidos" : d<=6 ? "brecha moderada" : "brecha amplia";
      t += `, frente a un promedio de ${p.toFixed(1)} en el niño o niña (${z}).`;
    }
    t += `\n`;
  });
  t += `\nEste documento fue generado automáticamente a partir de los registros de la familia; el texto de cada episodio fue escrito por quien lo observó, no por la aplicación.\n`;
  return t;
}

function textoAutorizacion(){
  return `AUTORIZACIÓN PARA COMPARTIR INFORMACIÓN\n\n`+
    `Yo, _______________________________________ (nombre de quien autoriza, madre/padre/tutor),\n`+
    `autorizo a _______________________________________ (nombre del profesionista),\n`+
    `con cédula profesional _______________________________________,\n`+
    `a conocer y hacer uso de la información contenida en este documento para _______________________________________ (motivo),\n`+
    `en relación con _______________________________________ (situación o causa).\n\n`+
    `Fecha: _______________________          Firma: _______________________\n\n`+
    `Nota: este es un formato base de autorización, no una plantilla revisada legalmente. Para procesos formales (dictámenes, procesos legales), se recomienda validarlo con asesoría legal.`;
}

async function mostrarExportarProfesionista(){
  overlayShow(`
    <div class="eyebrow">Antes de continuar</div>
    <h2 id="sheetTitle">Vas a compartir esta información con alguien más</h2>
    <p style="font-size:14px; line-height:1.5">Se va a preparar un documento de texto con el resumen y la autorización, listo para copiar a Word o para adjuntar tal cual. Tú decides, en el siguiente paso, a través de qué app enviarlo — nada se manda automáticamente todavía.</p>
    <div class="sheet-actions" style="margin-top:16px">
      <button class="skip" id="ep-no">Cancelar</button>
      <button class="btn" id="ep-si" style="margin-top:0">Continuar</button>
    </div>`);
  $("#ep-no").onclick = ()=>{ overlayHide(); render(); };
  $("#ep-si").onclick = async ()=>{
    overlayHide();
    const narrativa = generarNarrativa();
    const autorizacion = textoAutorizacion();
    const marcaInicio = "═══ COPIA DESDE AQUÍ ═══";
    const marcaFin = "═══ HASTA AQUÍ ═══";
    const instrucciones =
      "Este documento resume la observación doméstica de tu hijo o hija, para compartir con un profesionista.\n\n" +
      "Cómo usarlo — elige una opción:\n" +
      `  • Copia el texto entre "${marcaInicio}" y "${marcaFin}", y pégalo en un documento de Word, Google Docs, o cualquier plantilla en línea — ahí completas a mano los espacios en blanco de la autorización.\n` +
      "  • O, si el profesionista prefiere el archivo tal cual, adjunta o envía este mismo archivo de texto, sin copiar nada.\n";
    const cuerpoCompleto = instrucciones + "\n" + marcaInicio + "\n\n" + narrativa + "\n\n" + autorizacion + "\n\n" + marcaFin + "\n";

    const archivoNarrativa = new File([cuerpoCompleto], `Resumen para profesionista ${fechaCorta()}.txt`, {type:"text/plain"});

    const hayWebShare = typeof navigator.share === "function";
    const puedeCompartirArchivos = hayWebShare && navigator.canShare && navigator.canShare({ files:[archivoNarrativa] });

    if(hayWebShare && puedeCompartirArchivos){
      try{
        await navigator.share({
          title: "Bitácora del Temperamento — resumen para profesionista",
          text: "Adjunto el resumen de la Bitácora del Temperamento, con espacio para autorización por escrito.",
          files: [archivoNarrativa]
        });
        return; // la persona eligió una app y el sistema se encargó del envío
      }catch(e){
        if(e && e.name === "AbortError"){
          // Canceló el panel de compartir a propósito: no forzamos descarga ni correo, simplemente no pasa nada más.
          render();
          return;
        }
        // Falla real (no cancelación): seguimos con la alternativa de escritorio, más abajo.
      }
    }

function fechaCorta(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()}`;
}
function extraerJSON(texto){
  if(!texto) return "";
  const marca = texto.indexOf("RESPALDO COMPLETO EN FORMATO JSON");
  const zona = marca>-1 ? texto.slice(marca) : texto;
  const ini = zona.indexOf("{"), fin = zona.lastIndexOf("}");
  return (ini>-1 && fin>ini) ? zona.slice(ini, fin+1) : texto.trim();
}

function construirReflexion(){
  const eps = Array.isArray(S.episodios) ? S.episodios.slice() : [];
  const ahora = new Date();
  const limite = new Date(ahora.getTime() - 30*24*60*60*1000);
  const recientes = eps.filter(e=>{ const d=new Date((e.fecha||"")+"T12:00:00"); return !isNaN(d) && d>=limite; });
  const contar = (arr, getter)=>{
    const m={}; arr.forEach(e=>{ (getter(e)||[]).forEach(x=>{ if(!x) return; m[x]=(m[x]||0)+1; }); });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  };
  const contextos=contar(eps,e=>e.contexto);
  const apoyos=contar(eps,e=>e.apoyos);
  const situaciones={}; eps.forEach(e=>{const k=(e.situacion||"").trim(); if(k) situaciones[k]=(situaciones[k]||0)+1;});
  const repetidas=Object.entries(situaciones).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>=2).slice(0,4);
  const apoyoExitosos={};
  eps.forEach(e=>{
    if(!Array.isArray(e.apoyos)) return;
    e.apoyos.forEach(a=>{ if(a) apoyoExitosos[a]=(apoyoExitosos[a]||[]); if(a) apoyoExitosos[a].push(e.puntuacion); });
  });
  const apoyosResumen=Object.entries(apoyoExitosos).map(([k,v])=>({k,n:v.length,p:v.reduce((a,b)=>a+b,0)/v.length})).sort((a,b)=>b.n-a.n).slice(0,4);
  const funcionaron=S.micro.filter(m=>m.estado==='funciono');
  const probadas=S.micro.filter(m=>['funciono','amedias','nofunciono'].includes(m.estado));
  const porRasgo=RASGOS.map(r=>({r,p:promedio(r.id),n:eps.filter(e=>e.rasgo===r.id).length})).filter(x=>x.n);
  const destacados=porRasgo.slice().sort((a,b)=>b.n-a.n).slice(0,3);
  let tendencia="";
  if(eps.length>=4){
    const orden=eps.slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
    const mitad=Math.floor(orden.length/2); const a=orden.slice(0,mitad), b=orden.slice(mitad);
    const prom=x=>x.length?x.reduce((s,e)=>s+Number(e.puntuacion||0),0)/x.length:null;
    const pa=prom(a), pb=prom(b);
    if(pa!=null&&pb!=null){ const d=pb-pa;
      if(Math.abs(d)>=1) tendencia = d<0
        ? `En los registros más recientes, las puntuaciones promedio son ${Math.abs(d).toFixed(1)} puntos menores que en la primera parte de tu historial.`
        : `En los registros más recientes, las puntuaciones promedio son ${Math.abs(d).toFixed(1)} puntos mayores que en la primera parte de tu historial.`;
    }
  }
  return {eps,recientes,contextos,apoyos,repetidas,apoyosResumen,funcionaron,probadas,destacados,tendencia};
}

    tip.querySelector("rect").setAttribute("x", cx - anchoAprox/2);
    tip.querySelector("rect").setAttribute("y", cy - 32);
    tip.querySelector("rect").setAttribute("width", anchoAprox);
    tip.querySelector("rect").setAttribute("height", 20);
    tip.querySelector("text").setAttribute("x", cx);
    tip.querySelector("text").setAttribute("y", cy - 18);
    tip.querySelector("text").textContent = texto;
    tip.style.display = "block";
  };
  el.querySelectorAll(".radar-pt").forEach(pto=>{
    pto.onclick = () => activarPunto(pto);
    pto.onfocus = () => activarPunto(pto);
    pto.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); activarPunto(pto); } };
  });
  el.querySelectorAll("[data-u]").forEach(i=> i.onchange = ()=>{
    const r = rasgo(+i.dataset.u), u = umbral(r).slice();
    u[+i.dataset.i] = Number(i.value); S.umbrales[r.id] = u; save(); vPerfil();
  });
  $("#exp").onclick = async ()=>{
    const contenido = JSON.stringify(S, null, 2);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([contenido], {type:"application/json"}));
    a.download = `Respaldo de tu bitácora ${fechaCorta()}.json`;

    try{ await navigator.clipboard.writeText(contenido); $("#exp").textContent = "Descargado y copiado ✓"; }

  $("#restaurar").onclick = ()=> mostrarRestaurar();
  $("#print").onclick = ()=> imprimirReporteCompleto();
  $("#verOnb").onclick = ()=> showOnboarding(0, true);
  $("#verLegal").onclick = ()=> showLegal(true);
  $("#verFundamento").onclick = ()=> showFundamento();
  const setA11y = (patch)=>{

  $("#a11y-normal").onclick = ()=> setA11y({textoGrande:false});

      "BORRAR",
      ()=>{

function radarSVG(vals){
  const cx=200, cy=190, R=118, n=9;
  const pt=(i,rad)=>{ const a=-Math.PI/2 + i*2*Math.PI/n; return [cx+rad*Math.cos(a), cy+rad*Math.sin(a)]; };
  let g="";
  [0.25,0.5,0.75,1].forEach(f=>{
    const p = Array.from({length:n},(_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(",")).join(" ");
    g += `<polygon points="${p}" fill="none" stroke="#E2E5E1" stroke-width="1"/>`;
  });
  for(let i=0;i<n;i++){ const [x,y]=pt(i,R); g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E2E5E1" stroke-width="1"/>`; }
  const pts = vals.map((v,i)=> pt(i, R*((v??0)/10)).map(x=>x.toFixed(1)).join(",")).join(" ");
  g += `<polygon points="${pts}" fill="rgba(46,110,91,.16)" stroke="#2E6E5B" stroke-width="2" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{
    if(v==null) return;
    const [x,y]=pt(i,R*(v/10)), r2=RASGOS[i];
    const etiqueta = `${r2.corto}: ${v.toFixed(1)}`;
    // círculo visible + halo invisible más grande (mejor blanco táctil en pantallas pequeñas), foco de teclado y <title> para lectores de pantalla / hover de escritorio
    g += `<g class="radar-pt" tabindex="0" role="button" aria-label="${esc(etiqueta)}" data-i="${i}" style="cursor:pointer">
            <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="14" fill="transparent"/>
            <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#2E6E5B"/>
            <title>${esc(etiqueta)}</title>
          </g>`;
  });
  g += `<g id="radar-tip" style="display:none; pointer-events:none">
          <rect x="0" y="0" width="10" height="10" rx="6" fill="#132A2E"/>
          <text x="0" y="0" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="#fff"></text>
        </g>`;
  RASGOS.forEach((r,i)=>{
    const [x,y]=pt(i,R+24);
    const anchor = x<cx-6?"end":(x>cx+6?"start":"middle");
    const words = r.eje.split(" ");
    const l1 = words[0], l2 = words.slice(1).join(" ");
    g += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="#63797C">
            <tspan x="${x.toFixed(1)}" dy="0">${esc(l1)}</tspan>${l2?`<tspan x="${x.toFixed(1)}" dy="12">${esc(l2)}</tspan>`:""}</text>`;
  });
  return `<svg viewBox="0 0 400 390" role="img" aria-label="Gráfico de radar con los nueve rasgos">${g}</svg>`;
}

let obStep = 0;

function showFundamento(){
  overlayShow(`
    <div class="eyebrow">Fase 1 · Filosofía y propósito</div>
    <h2 id="sheetTitle">Fundamento de la herramienta</h2>

    <details open>
      <summary><b>Propósito</b></summary>
      <p><b>Conociéndonos</b> existe para ayudar a familias de escuelas públicas mexicanas a observar mejor el temperamento de sus hijos e hijas, encontrar un lenguaje compartido para nombrar lo que ven, y decidir —junto con la escuela y con un especialista cuando haga falta— qué ajustes de acompañamiento favorecen su bienestar y su participación.</p>
    </details>

    <details>
      <summary><b>Qué problema busca atender</b></summary>
      <p>Muchas familias enfrentan reacciones intensas, dificultad con los cambios, sensibilidad al entorno u otras respuestas de sus hijos e hijas sin tener herramientas para nombrarlas ni para decidir qué hacer. Ante la incertidumbre, algunas familias se vuelven muy permisivas o muy restrictivas —no por desinterés, sino por falta de orientación específica—, sobre todo cuando el niño o la niña tiene una discapacidad o una necesidad particular y la escuela no siempre cuenta con recursos adicionales para atenderla.</p>
    </details>

    <details>
      <summary><b>Qué sí hace</b></summary>
      <ul style="margin:6px 0 0; padding-left:20px; line-height:1.6">
        <li>Ayuda a registrar episodios cotidianos junto con su contexto: qué pasaba alrededor, qué apoyo hubo o podría ayudar.</li>
        <li>Organiza esos registros en 9 rasgos del temperamento para encontrar patrones de respuesta, no características fijas.</li>
        <li>Sugiere microacciones de acompañamiento que la familia puede probar y evaluar en su propio contexto.</li>
        <li>Ofrece una Bitácora Espejo para que el adulto reflexione sobre sus propias expectativas y respuestas.</li>
        <li>Genera reportes que la familia puede compartir con la escuela o con un profesional, si así lo decide.</li>
      </ul>
    </details>

    <details>
      <summary><b>Qué no hace</b></summary>
      <ul style="margin:6px 0 0; padding-left:20px; line-height:1.6">
        <li>No diagnostica ninguna condición, discapacidad ni trastorno.</li>
        <li>No sustituye la valoración de un profesional de la salud o de educación especial.</li>
        <li>No produce un puntaje global, un perfil psicológico ni una etiqueta sobre el niño o la niña — cada rasgo se interpreta por separado.</li>
        <li>No decide por la familia: las bandas y promedios son una referencia; la interpretación final siempre queda en manos del adulto.</li>
        <li>No envía datos del niño o niña a ningún servicio externo por defecto.</li>
      </ul>
    </details>

    <details>
      <summary><b>A quién está dirigida</b></summary>
      <p>A madres, padres, tutores y cuidadores de niñas y niños de escuelas primarias públicas en México — incluyendo, de manera explícita, a familias que acompañan a un hijo o hija con discapacidad o con necesidades específicas de apoyo, con o sin acceso a evaluación especializada. No requiere conocimientos previos de psicología ni de neurodesarrollo.</p>
    </details>

    <details>
      <summary><b>Principios éticos</b></summary>
      <ul style="margin:6px 0 0; padding-left:20px; line-height:1.6">
        <li>Observación situacional antes que etiqueta: se describe lo que ocurrió en un momento y contexto concretos, no lo que "es" el niño o la niña.</li>
        <li>Corresponsabilidad: ningún actor —familia, escuela o especialista— resuelve solo lo que observa la bitácora; el reporte existe para compartirse, no para quedarse aislado.</li>
        <li>Gratuidad y accesibilidad: sin costo, sin cuenta, pensada para funcionar con conectividad limitada y en teléfonos de gama baja.</li>
        <li>Transparencia: la aplicación nunca promete algo que su código no cumple; lo que dice que hace con los datos es exactamente lo que hace.</li>
      </ul>
    </details>

    <details>
      <summary><b>Fundamento conceptual y autoría</b></summary>
      <p><b>Base conceptual:</b> Thomas, A. &amp; Chess, S. (1956). <i>New York Longitudinal Study</i>. Establecieron el modelo original de los rasgos del temperamento infantil.</p>
      <p><b>Adaptación al español:</b> Andrea Cardemil Ricke, <i>Apego seguro</i>, cap. II (2017). Adaptó y explicó el modelo para público hispanohablante.</p>
      <p><b>Operacionalización de esta herramienta:</b> Prof. Eduardo Kantún Martínez, Escuela Primaria "Molino de Rosas", CDMX. Tradujo el marco conceptual en situaciones, preguntas de contexto, umbrales y microacciones concretas para esta bitácora.</p>
      <p class="hint">La herramienta toma como referencia el marco conceptual de Thomas y Chess y la adaptación señalada, y desarrolla una operacionalización propia para fines de observación reflexiva familiar. No se atribuye a esos autores los umbrales, preguntas ni microacciones específicas de esta aplicación: esos corresponden a su desarrollo particular.</p>
    </details>

    <details>
      <summary><b>Relación entre temperamento, contexto y conducta</b></summary>
      <p>Una misma conducta puede tener explicaciones distintas según el contexto en el que ocurre. Por eso la herramienta no sigue la lógica <b>conducta → puntuación → etiqueta</b>, sino el ciclo <b>observar → contexto → reflexionar → ajustar el entorno → volver a observar</b>. El temperamento es una forma de responder, no un destino: el mismo rasgo puede expresarse de maneras muy distintas según el descanso, el apoyo disponible, la claridad de la actividad o las condiciones del ambiente.</p>
    </details>

    <details>
      <summary><b>Principio de no diagnóstico</b></summary>
      <p>Ningún resultado de esta bitácora —ni un episodio, ni un promedio, ni un patrón repetido— constituye un diagnóstico. La aplicación organiza observaciones para ayudar a la familia a pensar, no para decidir qué "tiene" un niño o una niña. Cuando algo preocupa de forma sostenida, la orientación siempre es la misma: compartirlo con el pediatra, la escuela o un especialista.</p>
    </details>

    <details>
      <summary><b>Principio de no culpabilización</b></summary>
      <p>Observar no significa culpar. Una reacción difícil no significa que el niño o la niña sea "malo", "malcriado" ni que el adulto esté criando mal. La bitácora asume que la familia está intentando resolver una situación y necesita herramientas, no que está criando mal. Cuando el adulto y el niño difieren en un rasgo, eso tampoco significa que alguno de los dos esté mal: significa que necesitan formas distintas de acompañarse.</p>
    </details>
    <button class="btn" id="ob-ok">Entendido</button>`);
  $("#ob-ok").onclick = overlayHide;
}

function showOnboarding(step, revisita){
  obStep = step;
  const s = ONBOARD[step], last = step === ONBOARD.length-1;
  overlayShow(`
    <div class="icon" aria-hidden="true">${s.mascota? `<img src="${ICONOS.mascota}" alt="">` : s.icono}</div>
    <div class="eyebrow">Pantalla ${step+1} de ${ONBOARD.length}</div>
    <h2 id="sheetTitle">${esc(s.titulo)}</h2>
    ${s.texto? `<p>${esc(s.texto)}</p>` : `<div class="steps3">${s.pasos.map((p,i)=>
      `<div class="step"><span class="num">${i+1}</span><div><b>${esc(p[0])}</b><p style="margin:2px 0 0">${esc(p[1])}</p></div></div>`).join("")}</div>`}
    <div class="dots">${ONBOARD.map((_,i)=>`<span class="${i===step?"on":""}"></span>`).join("")}</div>
    <div class="sheet-actions">
      ${!last && !revisita? `<button class="skip" id="ob-skip">Omitir</button>`:""}
      <button class="btn" id="ob-next">${last? "Comenzar" : "Siguiente"}</button>
    </div>`);
  const fin = ()=>{ S.onboardingVisto = true; save(); overlayHide(); render(); };
  $("#ob-next").onclick = ()=> last ? fin() : showOnboarding(step+1, revisita);
  const skip = $("#ob-skip"); if(skip) skip.onclick = fin;
}

/* ─────────── microacciones: del verbo a la acción ─────────── */
const NIVELES = [["ya","Hoy · 1 minuto"],["prep","Esta semana"],["fondo","De fondo"]];
const ETAPAS = [["toddler","1-3 años"],["preescolar","4-6 años"],["escolar","7-11 años"]];
const RES_TXT = {
  funciono:"Guardado: pasa a tu repertorio. Lo que ya te funcionó en tu casa vale más que cualquier sugerencia.",
  amedias:"Guardado. A veces la acción es correcta y la dosis no: puedes retomarla cuando quieras.",
  nofunciono:"Guardado. Ese dato también sirve: descarta una vía para tu contexto. Ninguna acción funciona en todas las casas.",
  nopude:"Guardado, sin pendiente. La vida real manda; la bitácora espera."
};
function microSet(rid, bandaIdx){ const m = MICRO[rid]; return m ? m[["baja","media","alta"][bandaIdx]] : null; }
function microTexto(txt, sit){ return txt.split("{SIT}").join(sit ? sit : "una situación como esta"); }
function microPendiente(rid){ return S.micro.find(m=>m.estado==="pendiente" && m.rasgo===rid); }
function microResolver(id, estado){
  const m = S.micro.find(x=>x.id===id); if(!m) return;
  m.estado = estado; m.fechaRes = new Date().toISOString().slice(0,10); save();
}

function microFlujo(ep){
  const pend = microPendiente(ep.rasgo);
  if(pend) showMicroCierre(pend, ep);
  else showMicroOferta(ep, "");
}

function showMicroCierre(pend, ep){
  overlayShow(`
    <div class="eyebrow">Quedó algo abierto del registro anterior</div>
    <h2 id="sheetTitle">¿Probaste la microacción?</h2>
    <div class="m-opt" style="cursor:default">${esc(pend.texto)}</div>
    <p class="m-note">Cualquier respuesta es información útil. No hay respuesta mala.</p>
    <div class="m-res">
      <button data-res="funciono">Funcionó</button>
      <button data-res="amedias">A medias</button>
      <button data-res="nofunciono">No funcionó</button>
      <button data-res="nopude">No pude probarla</button>
    </div>`);
  $("#overlay").querySelectorAll("[data-res]").forEach(b=> b.onclick = ()=>{
    microResolver(pend.id, b.dataset.res);
    showMicroOferta(ep, RES_TXT[b.dataset.res]);
  });
}

function showMicroOferta(ep, aviso){
  const r = rasgo(ep.rasgo), bi = bandaDeScore(ep.puntuacion);
  const set = microSet(ep.rasgo, bi);
  if(!set){ overlayHide(); render(); return; }
  let nivel = "ya", elegida = null;
  // el banco por nivel puede tener varias frases; se muestra una muestra aleatoria de 3
  // (fija mientras el sheet está abierto) para variar de un episodio a otro sin saturar la pantalla
  const muestras = {};
  const muestraDe = niv => {
    if(!muestras[niv]){
      const arr = set[niv].slice();
      for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
      muestras[niv] = arr.slice(0, Math.min(3, arr.length));
    }
    return muestras[niv];
  };
  const pinta = ()=>{
    overlayShow(`
      ${aviso? `<p class="m-note" style="margin-top:0">${esc(aviso)}</p>`:""}
      <div class="eyebrow">Registrado ✓ · Del verbo a la acción</div>
      <h2 id="sheetTitle">${esc(r.accion[bi])}</h2>
      <p style="font-size:14px; margin:0 0 4px">Ese es el verbo del instrumento para la banda que elegiste. Si quieres, llévate <b>una</b> forma concreta de intentarlo — o ninguna. Tú decides.</p>
      <div class="seg" role="group" aria-label="¿Cuánto puedes ahora?" style="margin-top:10px">
        ${NIVELES.map(([k,lab])=>`<button data-niv="${k}" aria-pressed="${nivel===k}" class="${nivel===k?"on":""}">${lab}</button>`).join("")}
      </div>
      ${muestraDe(nivel).map((tx,i)=>{ const txr = microTexto(tx, ep.situacion);
        return `<button class="m-opt ${elegida===txr?"on":""}" aria-pressed="${elegida===txr}" data-op="${i}">${esc(txr)}</button>`;}).join("")}
      <details style="margin-top:12px"><summary>Para conversar con la escuela</summary><div class="inner">${esc(MICRO[ep.rasgo].puente)}</div></details>
      <div class="sheet-actions" style="margin-top:14px">
        <button class="skip" id="m-no">Hoy no</button>
        <button class="btn" id="m-ok" ${elegida?"":"disabled"} style="margin-top:0">Me la llevo</button>
      </div>`);
    const ov = $("#overlay");
    ov.querySelectorAll("[data-niv]").forEach(b=> b.onclick = ()=>{ nivel = b.dataset.niv; elegida = null; pinta(); });
    ov.querySelectorAll("[data-op]").forEach(b=> b.onclick = ()=>{ elegida = microTexto(muestraDe(nivel)[+b.dataset.op], ep.situacion); pinta(); });
    $("#m-no").onclick = ()=>{ overlayHide(); render(); };
    const ok = $("#m-ok");
    if(ok) ok.onclick = ()=>{
      if(!elegida) return;
      S.micro.push({id:String(Date.now()), rasgo:ep.rasgo, banda:bi, texto:elegida,
        fecha:new Date().toISOString().slice(0,10), estado:"pendiente"});
      save(); overlayHide(); render();
    };
  };
  pinta();
}

/* ─────────── arranque ─────────── */
function render(){
  if(vista==="rasgos") vRasgos();
  else if(vista==="rapido") vRapido();
  else if(vista==="rasgo") vRasgo();
  else if(vista==="form") vForm();
  else if(vista==="espejo") vEspejo();
  else if(vista==="perfil") vPerfil();
  else if(vista==="feedback") vFeedback();
}
(async function init(){
  const saved = migrar(await store.get());
  if(saved){
    S = Object.assign(S, saved);
  }else{
    await save();
  }
  aplicarPreferencias();
  render();
  if(!S.legalAceptado) showLegal(false);
  else if(!S.onboardingVisto) showOnboarding(0, false);
})();
